[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-vivint-bridge"
version = "0.1.0"
description = "Local-first bridge research scaffold for authorized Vivint panels and Home Assistant"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

